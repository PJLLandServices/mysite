<!-- Google Analytics 4 + Google Ads conversion tracking -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1B5RJLKKBR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-1B5RJLKKBR');
  // Google Ads conversion ID. Coexists with the GA4 property on the same
  // tag — both IDs are configured on one gtag() setup, GA4 is unaffected.
  gtag('config', 'AW-11358637592');

  // ── "Website Phone Click" conversion ──
  // Delegated on document (capture phase) instead of binding to
  // a[href^="tel:"] at DOMContentLoaded, because not every phone link
  // exists at load: coverage-checker.js writes call CTAs into its result
  // panel, and the chat widget can emit tel: links in a reply. A one-time
  // querySelectorAll pass would silently miss those.
  // Never preventDefault or delay — the dial must start instantly.
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || typeof t.closest !== 'function') return;
    if (!t.closest('a[href^="tel:"]')) return;
    if (typeof gtag === 'function') {
      gtag('event', 'conversion', {
        'send_to': 'AW-11358637592/CTBKCOOulN0cEJicnKgq'
      });
    }
  }, true);
</script>

<!-- Lead-source capture. Remembers where a visitor first came from (an ad's
     utm_* tags, a Facebook/Google click id, or the referring site) so the
     booking they make later — even pages later — records it. A tagged ad
     click always replaces what was stored (latest paid click wins); a plain
     referring site is only stored when nothing is. Kept for 90 days. js/booking.js reads window.pjlAttribution()
     and sends it with the booking; the server stores it on the lead. -->
<script>
  (function () {
    var KEY = 'pjl_attribution_v1', TTL = 90 * 864e5;
    function read() {
      try {
        var a = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (a && a.ts && Date.now() - a.ts < TTL) return a;
      } catch (e) {}
      return null;
    }
    try {
      var q = new URLSearchParams(location.search), hit = {}, any = false;
      ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid'].forEach(function (k) {
        var v = q.get(k); if (v) { hit[k] = v.slice(0, 200); any = true; }
      });
      var ref = document.referrer || '';
      var external = ref && ref.indexOf(location.hostname) === -1;
      if (any || (external && !read())) {
        hit.referrer = external ? ref.slice(0, 300) : '';
        hit.landingPage = (location.pathname + location.search).slice(0, 300);
        hit.ts = Date.now();
        localStorage.setItem(KEY, JSON.stringify(hit));
      }
    } catch (e) {}
    window.pjlAttribution = read;
  })();
</script>
