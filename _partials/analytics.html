<!-- Google Analytics 4 + Google Ads conversion tracking -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1B5RJLKKBR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-1B5RJLKKBR');
  // Google Ads conversion ID. Coexists with the GA4 property on the same
  // tag — both IDs are configured on one gtag() setup, GA4 is unaffected.
  gtag('config', 'AW-11358637592');

  // ── "Website Phone Click" conversion ──
  // Delegated on document (capture phase) instead of binding to
  // a[href^="tel:"] at DOMContentLoaded, because not every phone link
  // exists at load: coverage-checker.js writes call CTAs into its result
  // panel, and the chat widget can emit tel: links in a reply. A one-time
  // querySelectorAll pass would silently miss those.
  // Never preventDefault or delay — the dial must start instantly.
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || typeof t.closest !== 'function') return;
    if (!t.closest('a[href^="tel:"]')) return;
    if (typeof gtag === 'function') {
      gtag('event', 'conversion', {
        'send_to': 'AW-11358637592/CTBKCOOulN0cEJicnKgq'
      });
    }
  }, true);
</script>
