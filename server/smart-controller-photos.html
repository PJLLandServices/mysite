<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Controller photos — PJL CRM</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260518">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --green:#1B4D2E; --ink:#1a1a1a; --slate:#667; --line:#e3e6df; --bg:#f5f6f2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"DM Sans",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
  header.top { background:var(--green); color:#fff; padding:20px 24px; }
  header.top a { color:#cfe6cf; text-decoration:none; font-size:13px; }
  header.top h1 { font-family:"Barlow Condensed",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin:6px 0 2px; font-size:26px; }
  header.top p { margin:0; opacity:.85; font-size:14px; max-width:60ch; }
  .wrap { max-width:920px; margin:0 auto; padding:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media(max-width:680px){ .grid{ grid-template-columns:1fr; } }
  .slot { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .slot .pic { aspect-ratio:16/10; background:repeating-linear-gradient(45deg,#eef1ea,#eef1ea 12px,#e7ebe3 12px,#e7ebe3 24px); display:flex; align-items:center; justify-content:center; color:#7a8a6d; font-size:13px; letter-spacing:.04em; text-transform:uppercase; }
  .slot .pic img { width:100%; height:100%; object-fit:cover; display:block; }
  .slot .body { padding:16px 18px; }
  .slot h3 { font-family:"Barlow Condensed",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin:0 0 4px; font-size:18px; color:var(--green); }
  .slot .meta { font-size:12px; color:var(--slate); margin:0 0 12px; min-height:16px; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; }
  .btn { font:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:8px; border:1px solid var(--green); background:var(--green); color:#fff; cursor:pointer; }
  .btn.ghost { background:#fff; color:var(--green); }
  .btn.danger { border-color:#b3261e; color:#b3261e; background:#fff; }
  .btn[disabled] { opacity:.5; cursor:default; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .toast.err { background:#b3261e; }
</style>
</head>
<body>
<header class="top">
  <a href="/admin/quote-folder">&larr; Quotes</a>
  <h1>Smart Controller — design photos</h1>
  <p>These four photos appear on <strong>every</strong> HCC smart-controller proposal. Upload each once; they stay until you swap one. After changing a photo, re-generate any proposal to pick it up.</p>
</header>
<div class="wrap">
  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const DESIGN = "smart-controller";
const grid = document.getElementById("grid");
const toastEl = document.getElementById("toast");
let toastT = null;
function toast(msg, err) {
  toastEl.textContent = msg; toastEl.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastT); toastT = setTimeout(() => { toastEl.className = "toast"; }, 3200);
}
function fmtKb(b){ return b ? Math.max(1, Math.round(b/1024)) + " KB" : ""; }

async function load() {
  const r = await fetch(`/api/design-photos/${DESIGN}`, { cache:"no-store" });
  if (r.status === 403) { location.href = "/login?next=/admin/smart-controller-photos"; return; }
  const data = await r.json().catch(() => ({}));
  if (!data.ok) { toast("Couldn't load photos.", true); return; }
  grid.innerHTML = "";
  for (const s of data.slots) render(s);
}

function render(s) {
  const el = document.createElement("div");
  el.className = "slot";
  const img = s.present ? `<img src="/api/design-photos/${DESIGN}/${s.slot}/img?t=${Date.now()}" alt="${s.label}">` : `Not set`;
  const meta = s.present ? `Loaded${s.bytes?` · ${fmtKb(s.bytes)}`:""}` : "No photo yet — placeholder shows on the proposal";
  el.innerHTML = `
    <div class="pic">${img}</div>
    <div class="body">
      <h3>${s.label}</h3>
      <p class="meta">${meta}</p>
      <div class="btns">
        <button class="btn">${s.present ? "Replace photo" : "Upload photo"}</button>
        ${s.present ? '<button class="btn danger">Remove</button>' : ""}
        <input type="file" accept="image/*" hidden>
      </div>
    </div>`;
  const [uploadBtn, removeBtn] = el.querySelectorAll("button");
  const file = el.querySelector("input[type=file]");
  uploadBtn.addEventListener("click", () => file.click());
  file.addEventListener("change", (e) => onFile(e, s, el));
  if (removeBtn && removeBtn.classList.contains("danger")) {
    removeBtn.addEventListener("click", () => onRemove(s));
  }
  grid.appendChild(el);
}

function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => resolve(String(fr.result).split(",")[1] || "");
    fr.readAsDataURL(file);
  });
}

async function onFile(e, s, el) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)) { toast("Choose a JPG or PNG.", true); return; }
  if (f.size > 30 * 1024 * 1024) { toast("Photo too large (30 MB cap).", true); return; }
  const btns = el.querySelectorAll("button"); btns.forEach(b => b.disabled = true);
  try {
    const data = await readAsBase64(f);
    const r = await fetch(`/api/design-photos/${DESIGN}/${s.slot}`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ filename: f.name, data })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) { toast((j.errors && j.errors[0]) || "Upload failed.", true); btns.forEach(b => b.disabled = false); return; }
    toast(`${s.label} updated.`);
    load();
  } catch (err) { toast(err.message || "Upload failed.", true); btns.forEach(b => b.disabled = false); }
}

async function onRemove(s) {
  if (!confirm(`Remove the ${s.label} photo? The proposal will show the placeholder until you upload a new one.`)) return;
  const r = await fetch(`/api/design-photos/${DESIGN}/${s.slot}`, { method: "DELETE" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) { toast((j.errors && j.errors[0]) || "Remove failed.", true); return; }
  toast(`${s.label} removed.`);
  load();
}

load();
</script>
</body>
</html>
