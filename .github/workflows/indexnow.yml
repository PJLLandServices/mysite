name: IndexNow + Search Console notification

# Ping the search engines every time main moves:
#
#   1. Bing's IndexNow API — tells Bing (and any IndexNow-participating
#      engine) to re-crawl, so updates show up in search within minutes
#      instead of waiting for natural discovery. The IndexNow key is public
#      by design (verified via the .txt file at the site root) so no GitHub
#      secret is needed.
#
#   2. Google Search Console — resubmits sitemap.xml through the API with
#      the pjl-seo service account, the same as clicking "resubmit" in the
#      Sitemaps report. Needs two repository secrets: GSC_SERVICE_ACCOUNT_JSON
#      (the full key-file JSON) and GSC_SITE_URL (sc-domain:pjllandservices.com).
#      Until they exist the step prints a notice and passes. Google still
#      decides when to recrawl — "Request indexing" for a specific page stays
#      a manual click in the Search Console UI (the API has no such call).

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# If a new push happens while a previous run is in-flight, cancel the old
# one — only the latest set of URLs matters.
concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Wait briefly so Render's deploy has time to publish the new content
      # before Bing arrives to crawl. Render typically deploys in 1–3 min.
      - name: Wait for Render deploy to settle
        run: sleep 90

      - name: Submit URLs to IndexNow
        run: node scripts/indexnow-submit.js

      # Runs even if the IndexNow step failed — the two pings are independent.
      - name: Resubmit sitemap.xml to Google Search Console
        if: ${{ always() }}
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: node scripts/gsc.mjs submit-sitemap
