name: CI — build & price-lint checks

# Runs the full static-site verification suite on every pull request and every
# push to main. This is the gate that was MISSING: previously the only workflow
# was indexnow.yml (a post-merge Bing ping), so `npm run build:check` — which
# includes the hardcoded-price linter, the partial-build sync check, the
# meta-price sync check, the sitemap idempotency check, and the pricing tests —
# only ever ran when a developer remembered to run it locally. Pages could (and
# did) merge with drift the linter would have caught. This workflow closes that
# gap: the same command now runs automatically and blocks the merge on failure.

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref is enough; cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # generate-sitemap.mjs derives <lastmod> from each file's last git
          # commit date, so it needs full history — a shallow clone would make
          # the sitemap idempotency check non-deterministic.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Both lockfiles, because both trees get installed below.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pjl-field/package-lock.json

      # `build:check` used to need no install — every script used only Node
      # built-ins. That stopped being true in 2026-08: test-prepared-for-address
      # and test-line-item-order render a REAL proposal PDF to assert what the
      # customer actually receives (the address block, the line-item order), and
      # that pulls in pdfkit. Without this step both crash on MODULE_NOT_FOUND
      # at server/lib/quote-pdf.js. Taking the honest option the note here always
      # pointed at, rather than weakening the tests to dodge the dependency.
      - name: Install dependencies
        run: npm ci

      # The phone app is now part of what CI verifies, so its dependencies
      # have to be here too. test-app-parses.mjs parses every app source
      # with the app's own Babel, and test-tap-to-pay.mjs reads the Stripe
      # Terminal SDK's type definitions to check the API this integration
      # calls still exists.
      #
      # This is not free — it is the React Native toolchain, and it is the
      # slowest step in the job. Taken deliberately, for the same reason
      # the note above took it: the alternative is a suite that skips
      # itself when the dependency is missing, and a check that silently
      # proves nothing is worse than no check. That failure mode is not
      # hypothetical here — on 2026-09-06 an assertion that only looked
      # for the WORD "requireAdmin" stayed green while the endpoint it
      # guarded was open to the internet.
      - name: Install the field app's dependencies
        working-directory: pjl-field
        run: npm ci

      - name: Run build + price-lint checks
        run: npm run build:check
