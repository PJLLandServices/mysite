name: Field app — publish OTA update

# Publishes the iPhone app's JavaScript to the phones that run it, on every
# merge to main that touches pjl-field/.
#
# WHY THIS EXISTS. Publishing used to mean Patrick at his desk running an eas
# command by hand. That is the wrong place for it twice over: he is usually in
# a truck, and a step done by hand is a step done inconsistently. GitHub can
# reach Expo's servers, so it does the publishing.
#
# THE PINNED VERSION IS LOAD-BEARING. The native guard below computes the
# fingerprint BY THE CLI. On 2026-09-02 an update
# published with `eas-cli@latest` hashed an unchanged project differently from
# the installed build — three files had dropped out of the hashed set between
# CLI releases — so the update went to a runtime no phone was listening on,
# and the app quietly ran the previous day's code while every command reported
# success. The version below MUST stay in step with `cli.version` in
# pjl-field/eas.json, which is what the build uses. If they drift, updates stop
# arriving and nothing says so.
#
# Only the app's JavaScript ships this way. A new native module, an icon, an SDK
# bump, app.json or eas.json changes the native fingerprint and needs a new
# version and a real build (on the Mac while Tap to Pay's entitlement is a
# development one: docs/ONE_APP_MAC_BUILD.md).
#
# You do not have to work out which case you are in. Before publishing, this
# workflow checks the tree's native fingerprint against the one recorded for
# its version (config/field-native.json) and refuses when they differ. That
# check is the whole point: publishing to a runtime nothing can run is not an
# error in any tool, it is simply nothing happening, and it looks identical to
# success.

on:
  push:
    branches: [main]
    # Server-only changes are the majority of commits here and have nothing to
    # publish. Narrowing the trigger keeps the run log meaningful: a run in this
    # workflow means the app actually changed.
    paths:
      - 'pjl-field/**'
      - '.github/workflows/field-app-update.yml'
  # Publishing by hand, for a re-publish after a rollback or a rebuild.
  workflow_dispatch:

# A newer merge supersedes an older one. Cancelling in flight is safe: an update
# is a whole bundle, not an increment, so the last one to finish is the truth.
concurrency:
  group: field-app-update
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Without the token the CLI would sit waiting for a login nobody can give
    # it. Fail the run with a sentence that says what to do instead.
    steps:
      - name: Check the Expo token is present
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN is not set. Add the Expo robot token under"
            echo "::error::Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pjl-field/package-lock.json

      # `npm ci` installs the lockfile exactly. That matters here beyond the
      # usual reasons: the dependency tree feeds the fingerprint, so a loose
      # install could publish to a runtime the phones are not listening on.
      - name: Install
        working-directory: pjl-field
        run: npm ci

      # THE CHECK THIS WORKFLOW EXISTS FOR.
      #
      # An update only reaches a phone whose installed build has the same
      # runtime, and only runs there if it was built against the same native
      # code. Nothing in the publish path enforces either: `eas update`
      # publishes and reports success whether or not any phone can take it.
      # Twice that silence cost a day (a CLI release that changed the hashed
      # file set; a one-line `ascAppId` that moved the fingerprint).
      #
      # Since the one-app build (PJL-114) the runtime is the app version
      # (runtimeVersion policy appVersion, 1.1.0), because PJL Field is built
      # on Patrick's Mac and the Mac and Linux never agreed on the
      # fingerprint. The fingerprint is now the native-code check instead:
      # config/field-native.json records the fingerprint each version was
      # built from, and this refuses to publish from a tree that no longer
      # matches it. A red X with a sentence beats a green tick that did nothing.
      - name: Check the native code is the build's
        run: node scripts/field-native-guard.mjs

      # Stamp the commit into the bundle, so the installed app can say which
      # commit it runs (Today tab footer) and send it on every request (the
      # server logs "[field-client] … commit=…"). Committed LOCALLY, never
      # pushed: EAS packs the project from git, and a clean tree is what it
      # uploads. buildInfo.json is JavaScript-only — it does not move the
      # native fingerprint, so builds and updates stay on one runtime.
      - name: Stamp the commit into the app
        run: |
          node scripts/stamp-field-build-info.mjs update
          git -c user.name="PJL field update" -c user.email="field-update@pjllandservices.invalid" \
            commit -q -m "Stamp update ${GITHUB_SHA::7} (not pushed)" -- pjl-field/src/buildInfo.json

      - name: Publish the update
        working-directory: pjl-field
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Through the environment rather than interpolated into the command:
          # a commit message is text someone else wrote, and `${{ }}` pastes it
          # into the shell before bash ever sees a quote.
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || 'Manual publish' }}
        run: |
          npx eas-cli@23.2.0 update \
            --branch production \
            --message "$UPDATE_MESSAGE" \
            --non-interactive

      # The runtime version the update went to is the one thing worth reading in
      # this log. If it stops matching the installed build's, updates are being
      # published into the void — which looks exactly like success.
      - name: Show what the phones will receive
        working-directory: pjl-field
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@23.2.0 branch:view production --non-interactive || true
