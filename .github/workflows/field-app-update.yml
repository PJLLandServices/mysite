name: Field app — publish OTA update

# Publishes the iPhone app's JavaScript to the phones that run it, on every
# merge to main that touches pjl-field/.
#
# WHY THIS EXISTS. Publishing used to mean Patrick at his desk running an eas
# command by hand. That is the wrong place for it twice over: he is usually in
# a truck, and a step done by hand is a step done inconsistently. GitHub can
# reach Expo's servers, so it does the publishing.
#
# THE PINNED VERSION IS LOAD-BEARING. runtimeVersion is on the `fingerprint`
# policy, and the fingerprint is computed BY THE CLI. On 2026-09-02 an update
# published with `eas-cli@latest` hashed an unchanged project differently from
# the installed build — three files had dropped out of the hashed set between
# CLI releases — so the update went to a runtime no phone was listening on,
# and the app quietly ran the previous day's code while every command reported
# success. The version below MUST stay in step with `cli.version` in
# pjl-field/eas.json, which is what the build uses. If they drift, updates stop
# arriving and nothing says so.
#
# Only the app's JavaScript ships this way. A new native module, an icon, an SDK
# bump, app.json or eas.json changes the fingerprint and needs a real build
# through TestFlight — run "Field app — build for TestFlight".
#
# You do not have to work out which case you are in. Before publishing, this
# workflow compares the runtime this checkout would publish to against the newest
# finished build's, and refuses to publish when they differ. That check is the
# whole point: publishing to a runtime nothing is listening on is not an error in
# any tool, it is simply nothing happening, and it looks identical to success.

on:
  push:
    branches: [main]
    # Server-only changes are the majority of commits here and have nothing to
    # publish. Narrowing the trigger keeps the run log meaningful: a run in this
    # workflow means the app actually changed.
    paths:
      - 'pjl-field/**'
      - '.github/workflows/field-app-update.yml'
  # Publishing by hand, for a re-publish after a rollback or a rebuild.
  workflow_dispatch:

# A newer merge supersedes an older one. Cancelling in flight is safe: an update
# is a whole bundle, not an increment, so the last one to finish is the truth.
concurrency:
  group: field-app-update
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Without the token the CLI would sit waiting for a login nobody can give
    # it. Fail the run with a sentence that says what to do instead.
    steps:
      - name: Check the Expo token is present
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN is not set. Add the Expo robot token under"
            echo "::error::Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pjl-field/package-lock.json

      # `npm ci` installs the lockfile exactly. That matters here beyond the
      # usual reasons: the dependency tree feeds the fingerprint, so a loose
      # install could publish to a runtime the phones are not listening on.
      - name: Install
        working-directory: pjl-field
        run: npm ci

      # THE CHECK THIS WORKFLOW EXISTS FOR.
      #
      # An update only reaches a phone whose installed build has the same runtime
      # version. Nothing in the publish path enforces that: `eas update` computes
      # the runtime from this checkout, publishes to it, and reports success
      # whether or not any build is listening. Twice now that silence has cost a
      # day — once when a CLI release changed the hashed file set, and once when a
      # one-line `ascAppId` in eas.json (a submit-only setting that cannot affect
      # the binary) moved the runtime out from under a build made hours earlier.
      #
      # So: compare before publishing, and fail loudly instead of publishing into
      # the void. A red X with a sentence beats a green tick that did nothing.
      - name: Check a build is actually listening
        id: runtime
        working-directory: pjl-field
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail

          # What this checkout would publish to. `eas update` delegates the
          # fingerprint to the project's own expo-updates, so this is the same
          # number by the same code — not a reimplementation of it.
          update_rt=$(npx expo-updates fingerprint:generate --platform ios \
            | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).hash")

          # Ask the question that actually matters: does a finished iOS build
          # listening on that runtime exist? Not "does the newest build match" —
          # an update reaches ANY installed build with the same runtime, and the
          # phone in the truck is not necessarily running the latest one.
          match=$(npx eas-cli@23.2.0 build:list \
            --platform ios --status finished \
            --runtime-version "$update_rt" \
            --limit 1 --json --non-interactive \
            | node -pe "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); (Array.isArray(j)?j:(j.builds||[])).length")

          echo "This update would go to runtime $update_rt"
          echo "Finished iOS builds on that runtime: $match"

          if [ "$match" -ge 1 ] 2>/dev/null; then
            echo "A build is listening. The phones will get this."
            exit 0
          fi

          # Nothing is listening. Say what IS out there, so the log answers the
          # obvious next question without another round trip.
          echo "Most recent finished iOS builds:"
          npx eas-cli@23.2.0 build:list --platform ios --status finished \
            --limit 3 --json --non-interactive \
            | node -pe "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); (Array.isArray(j)?j:(j.builds||[])).map(b=>'  '+(b.runtimeVersion||'?')+'  '+(b.appBuildVersion||'?')+'  '+(b.completedAt||'')).join('\n')" \
            || true

          echo "::error::No installed build can receive this update, so it was NOT published."
          echo "::error::This checkout publishes to runtime $update_rt and no finished iOS build"
          echo "::error::listens on it — something in the native fingerprint changed (app.json,"
          echo "::error::eas.json, or a dependency)."
          echo "::error::Fix: Actions → 'Field app — build for TestFlight' → Run workflow. Install"
          echo "::error::it from TestFlight, then re-run this workflow."
          exit 1

      - name: Publish the update
        working-directory: pjl-field
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Through the environment rather than interpolated into the command:
          # a commit message is text someone else wrote, and `${{ }}` pastes it
          # into the shell before bash ever sees a quote.
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || 'Manual publish' }}
        run: |
          npx eas-cli@23.2.0 update \
            --branch production \
            --message "$UPDATE_MESSAGE" \
            --non-interactive

      # The runtime version the update went to is the one thing worth reading in
      # this log. If it stops matching the installed build's, updates are being
      # published into the void — which looks exactly like success.
      - name: Show what the phones will receive
        working-directory: pjl-field
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@23.2.0 branch:view production --non-interactive || true
