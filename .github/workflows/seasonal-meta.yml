name: Seasonal meta — flip the town-page titles on the window boundaries

# The town pages' <title> / meta description carry a seasonal suffix ("Fall
# Closings from $90", "Spring Openings from $90", or the off-season line).
# Google indexes what it crawls, so the switch has to land in the source
# HTML on a schedule — not in the browser. This workflow runs the build on
# each window boundary from season.config.json, commits whatever changed,
# and pushes to main. That push triggers the existing Render deploy and the
# IndexNow ping; Patrick then re-requests indexing on the core pages in GSC.
#
# Boundaries (UTC 09:00 = 05:00 Toronto):
#   Mar 1  → spring meta        Jun 16 → off-season
#   Aug 1  → fall meta          Nov 21 → off-season
#
# "Run workflow" from the Actions tab does a DRY RUN by default: it resolves
# the season, rewrites the pages in the runner, prints the diff, and pushes
# nothing. Tick "push" to commit for real (for example after editing
# seasonal-meta.json out of cycle).

on:
  schedule:
    - cron: '0 9 1 3 *'
    - cron: '0 9 1 8 *'
    - cron: '0 9 16 6 *'
    - cron: '0 9 21 11 *'
  workflow_dispatch:
    inputs:
      push:
        description: 'Commit and push the rewritten pages to main (leave unticked for a dry run)'
        type: boolean
        default: false

concurrency:
  group: seasonal-meta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  flip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # generate-sitemap.mjs derives <lastmod> from git history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve the season and rebuild
        run: |
          node scripts/sync-seasonal-meta.mjs --dry-run --verbose
          npm run build

      - name: Show what changed
        run: |
          git status --short
          git diff --stat

      - name: Commit and push
        if: ${{ github.event_name == 'schedule' || inputs.push }}
        run: |
          if git diff --quiet; then
            echo "Nothing changed — the pages already carry this season's meta."
            exit 0
          fi
          SEASON=$(node scripts/sync-seasonal-meta.mjs --print-season)
          git config user.name  "PJL Land Services"
          git config user.email "patrick@pjllandservices.com"
          # The sitemap was regenerated by the build from PRE-commit dates; commit
          # the pages first so their lastmod reads today's date, then refresh it.
          git add -A
          git commit -m "chore: seasonal meta → ${SEASON}"
          node scripts/generate-sitemap.mjs
          git add sitemap.xml
          git commit -m "chore: sitemap lastmod for the seasonal meta flip" || true
          git push origin main

      - name: Dry run — nothing pushed
        if: ${{ !(github.event_name == 'schedule' || inputs.push) }}
        run: echo "Dry run complete. Re-run with 'push' ticked to commit to main."
